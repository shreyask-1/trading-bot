# Pre-market briefing: gathers scored news + chart setups + earnings calendar
# and makes exactly ONE Gemini call per day to decide what matters for today.
name: Morning Prep

on:
  schedule:
    - cron: "0 12,13 * * 1-5"
  workflow_dispatch: {}

concurrency:
  # Same group as run-bot.yml so morning prep and the trading loop never
  # write logs/ and data/ at the same time (that overlap caused the
  # merge-conflict failures).
  group: trading-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning prep
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python morning_prep.py

      - name: Commit and push briefing
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add logs/ data/

          if git diff --staged --quiet; then
            echo "No prep changes to commit."
          else
            git commit -m "Update morning briefing and earnings calendar [skip ci]"
            # Merge (NOT rebase) so a concurrent run's push can never leave the
            # repo stuck in a broken rebase state. `-X ours` auto-resolves any
            # log/state conflict in favor of THIS run's freshly written files.
            git fetch origin main
            git merge -X ours -m "Sync bot state, keep local logs [skip ci]" origin/main
            git push
          fi
