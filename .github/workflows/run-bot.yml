name: Run Trading Bot

on:
  schedule:
    # Fallback hourly safety net in case external cron (e.g. cron-job.org) drops
    - cron: "0 * * * *"
  workflow_dispatch: {} # Manual trigger or external 2-min API trigger

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Speeds up execution by caching pip dependencies

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the trading bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python main.py

      - name: Commit and push updated logs and trade memory
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          
          # Stage both operational logs and trade memory state
          git add logs/ data/
          
          if git diff --staged --quiet; then
            echo "No log or memory changes to commit."
          else
            git commit -m "Update operational logs and trade memory [skip ci]"
            git pull --rebase origin main
            git push
          fi
