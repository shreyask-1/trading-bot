name: Run Trading Bot

on:
  schedule:
    # Fallback hourly safety net in case external cron (e.g. cron-job.org) drops
    - cron: "0 * * * *"
  workflow_dispatch: {} # Manual trigger or external 2-min API trigger

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the trading bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Optional: ping you on margin warnings / halts / flattens.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional risk-tuning overrides (see config.py for all options):
          # TRADE_ONLY_DURING_MARKET_HOURS, MAX_TOTAL_EXPOSURE_PCT,
          # DAILY_LOSS_HALT_PCT, MAX_DRAWDOWN_DELEVERAGE_PCT,
          # MAX_DRAWDOWN_FLATTEN_PCT, RESET_EQUITY_PEAK_ON_START
        run: python main.py

      - name: Commit and push updated logs and trade memory
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add logs/ data/

          if git diff --staged --quiet; then
            echo "No log or memory changes to commit."
          else
            git commit -m "Update operational logs and trade memory [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
