name: Run Trading Bot

on:
  schedule:
    # Fallback hourly safety net in case external cron (e.g. cron-job.org) drops
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the trading bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and push updated logs and trade memory
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add logs/ data/

          if git diff --staged --quiet; then
            echo "No log or memory changes to commit."
          else
            git commit -m "Update operational logs and trade memory [skip ci]"
            # Merge (NOT rebase) so a concurrent run's push can never leave the
            # repo stuck in a broken rebase state. `-X ours` auto-resolves any
            # log/state conflict in favor of THIS run's freshly written files
            # (JSON/CSV snapshots are latest-write-wins); append-only .log/.txt
            # files still combine via merge=union in .gitattributes.
            git fetch origin main
            git merge -X ours -m "Sync bot state, keep local logs [skip ci]" origin/main
            git push
          fi
