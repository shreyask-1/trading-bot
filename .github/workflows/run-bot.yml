name: Run Trading Bot

on:
  schedule:
    # Fallback hourly safety net in case external cron (e.g. cron-job.org) drops
    - cron: "0 * * * *"
  # For real daytrading cadence, point cron-job.org at the workflow_dispatch
  # URL every 2-5 min during market hours (9:30-16:00 ET weekdays). The
  # concurrency group above prevents overlapping runs. Requires a PAT secret
  # (GH_PAT) if the repo is private. The pre-market briefing runs in its own
  # workflow (morning-prep.yml) so it makes exactly one Gemini call per day.
  workflow_dispatch: {}

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the trading bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Optional: ping you on margin warnings / halts / flattens.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional risk-tuning overrides (see config.py for all options):
          # TRADE_ONLY_DURING_MARKET_HOURS, MAX_TOTAL_EXPOSURE_PCT,
          # DAILY_LOSS_HALT_PCT, MAX_DRAWDOWN_DELEVERAGE_PCT,
          # MAX_DRAWDOWN_FLATTEN_PCT, RESET_EQUITY_PEAK_ON_START
          # Gemini quota for 24/7 operation: with a 2-min cadence (~720
          # runs/day) and budget 1000, every run gets its Gemini call and
          # the quota lasts all day (720 < 1000) -- the pacing only stops
          # burst stacking, never normal runs. Set to 0 to disable pacing
          # (Gemini burns Google's limit mid-day, technical engine after).
          GEMINI_DAILY_BUDGET: 1000
          # Internal wall-clock budget for the whole run. 30s (not 50s)
          # because imports + account fetch + reconciliation + regime run
          # BEFORE the deadline starts; on a slow GitHub runner that
          # overhead is ~10-20s, and 50s + 20s = 70s > the 60s shell cap =
          # exit 124. With 30s the worst case is ~30s + 20s = ~50s -- always
          # inside `timeout 60`. Normal runs (8-34s) are unaffected; the
          # budget only binds when something hangs.
          RUN_BUDGET_SECONDS: 30
        # Hard shell backstop: main.py already budgets itself (RUN_BUDGET_SECONDS
        # above), but `timeout` guarantees the python step can NEVER exceed 60s
        # even if some API hangs past every internal budget (exit 124 = killed).
        # The commit step below still runs via `if: always()`.
        run: timeout 60 python main.py

      - name: Commit and push updated logs and trade memory
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add logs/ data/

          if git diff --staged --quiet; then
            echo "No log or memory changes to commit."
          else
            git commit -m "Update operational logs and trade memory [skip ci]"
            # Merge (NOT rebase) so a concurrent run's push can never leave the
            # repo stuck in a broken rebase state. `-X ours` auto-resolves any
            # log/state conflict in favor of THIS run's freshly written files
            # (JSON/CSV snapshots are latest-write-wins); append-only .log/.txt
            # files still combine via merge=union in .gitattributes.
            git fetch origin main
            git merge -X ours -m "Sync bot state, keep local logs [skip ci]" origin/main
            git push
          fi
